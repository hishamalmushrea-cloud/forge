<svg xmlns="http://www.w3.org/2000/svg" width="700" height="460" font-family="sans-serif">
<rect width="700" height="460" fill="#1e4f9c"/>
<text x="350" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="white">Desal cell — exploded assembly, order 1→7 (dims mm, STATUS: DRAWN)</text>
<rect x="60" y="120" width="22" height="220" fill="#cbd5e1"/>
<text x="71" y="235" text-anchor="middle" font-size="10" fill="#0f172a" transform="rotate(-90 71 235)">endplate 150×150×10</text>
<circle cx="71" cy="105" r="12" fill="#fbbf24"/><text x="71" y="109" text-anchor="middle" font-size="12" font-weight="bold">1</text>
<rect x="95" y="130" width="10" height="200" fill="#7dd3fc"/>
<text x="100" y="110" text-anchor="middle" font-size="11" fill="white">②gasket</text>
<rect x="118" y="120" width="26" height="220" fill="#475569"/>
<text x="131" y="235" text-anchor="middle" font-size="10" fill="white" transform="rotate(-90 131 235)">graphite + PB coat ③</text>
<rect x="160" y="120" width="70" height="220" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-dasharray="6,4"/>
<text x="195" y="225" text-anchor="middle" font-size="11" fill="#7dd3fc">water gap ④</text>
<text x="195" y="242" text-anchor="middle" font-size="11" fill="#7dd3fc">15mm, ~1.0L</text>
<rect x="246" y="120" width="18" height="220" fill="#e2e8f0"/>
<text x="255" y="235" text-anchor="middle" font-size="10" fill="#0f172a" transform="rotate(-90 255 235)">Ag sheet ⑤ 120×120</text>
<rect x="277" y="130" width="10" height="200" fill="#7dd3fc"/>
<text x="282" y="110" text-anchor="middle" font-size="11" fill="white">⑥gasket</text>
<rect x="300" y="120" width="22" height="220" fill="#cbd5e1"/>
<text x="311" y="235" text-anchor="middle" font-size="10" fill="#0f172a" transform="rotate(-90 311 235)">endplate ⑦</text>
<line x1="71" y1="90" x2="311" y2="90" stroke="white" stroke-width="1"/>
<circle cx="71" cy="90" r="3" fill="white"/><circle cx="311" cy="90" r="3" fill="white"/>
<text x="191" y="82" text-anchor="middle" font-size="10" fill="white">stack ≈ 65 + tie rods ×4 (corners, wing nuts)</text>
<line x1="195" y1="340" x2="195" y2="380" stroke="#7dd3fc" stroke-width="4"/>
<text x="195" y="396" text-anchor="middle" font-size="11" fill="white">IN (bottom barb)</text>
<line x1="195" y1="120" x2="195" y2="70" stroke="#7dd3fc" stroke-width="4"/>
<text x="270" y="62" font-size="11" fill="white">OUT (top) + TDS probe port</text>
<line x1="131" y1="120" x2="131" y2="70" stroke="#fbbf24" stroke-width="3"/>
<text x="60" y="62" font-size="11" fill="#fbbf24">(−) PB terminal</text>
<line x1="255" y1="120" x2="255" y2="70" stroke="#fbbf24" stroke-width="3"/>
<text x="420" y="150" font-size="12" fill="white">Build order:</text>
<text x="420" y="172" font-size="11" fill="white">1. endplate on bench</text>
<text x="420" y="192" font-size="11" fill="white">2. gasket + leak test later</text>
<text x="420" y="212" font-size="11" fill="white">3. PB electrode (coat UP)</text>
<text x="420" y="232" font-size="11" fill="white">4. gap frame (water room)</text>
<text x="420" y="252" font-size="11" fill="white">5. Ag electrode (faces PB)</text>
<text x="420" y="272" font-size="11" fill="white">6. gasket, 7. endplate</text>
<text x="420" y="292" font-size="11" fill="white">8. rods diagonal-tighten</text>
<text x="420" y="320" font-size="11" fill="#fbbf24">Leak test with tap water</text>
<text x="420" y="338" font-size="11" fill="#fbbf24">BEFORE any seawater/power</text>
</svg>
